# nefuOS boot entry for the ISO's El Torito *EFI* boot image.
#
# This config lives inside the FAT32 EFI boot image (tools/make_efi_img.py),
# which also carries BOOTX64.EFI, the GRUB modules and the kernel.  It is
# deliberately device-independent: a real UEFI firmware exposes the boot media
# as (cd0), (hd0,gpt1), (hd1,msdos1) or similar depending on whether the image
# was launched from the ISO's EFI record or written straight to a USB stick, so
# hardcoding a device name (the old `set root=(hd0,gpt1)`) breaks everywhere
# except the one QEMU/OVMF layout it was written against.
#
# `search --set=root --file /EFI/nefuos/nefuos.bin` asks GRUB to scan every
# device it can see for the kernel and bind root to whichever one has it.
#
# The kernel's multiboot2 header (backends/bare/entry.s) requests a
# 1024x768x32 linear framebuffer; GRUB enters the kernel in 32-bit protected
# mode with EAX=0x36D76289 and EBX pointing at the multiboot2 info structure.

set timeout=3
set default=0

# The GRUB modules that are NOT compiled into the monolithic BOOTX64.EFI live
# next to this file (see make_efi_img.py).  Load them from $prefix first, which
# resolves correctly whether GRUB booted from /EFI/BOOT or /EFI/debian.
if [ -f "$prefix/x86_64-efi/multiboot2.mod" ]; then
    insmod "$prefix/x86_64-efi/multiboot2.mod"
else
    insmod multiboot2
fi

insmod all_video
insmod video
insmod efi_gop
insmod gfxterm
insmod search
insmod search_fs_file
insmod echo

# Find the kernel: scan every device for the known path.  Falls back to the
# boot device itself when search finds nothing (single-media images).
search --no-floppy --set=root --file /EFI/nefuos/nefuos.bin
if [ -z "$root" ]; then
    set root=$prefix
fi

menuentry "nefuOS" {
    multiboot2 /EFI/nefuos/nefuos.bin
    boot
}
