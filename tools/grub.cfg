# nefuOS boot entry — GRUB loads the kernel via the multiboot2 protocol.
#
# The kernel's multiboot2 header (backends/bare/entry.s) requests a
# 1024x768x32 linear framebuffer and is loaded at 0x20000.  GRUB enters the
# kernel in 32-bit protected mode with EAX=0x36D76289 and EBX pointing at the
# multiboot2 info structure; entry.s parses the framebuffer tag and builds
# the same 0x7000 bootinfo the legacy ISO path uses.
#
# Device (hd0,gpt1) is the ESP of the first disk — deterministic for the
# nefuOS_esp.img test image (QEMU/OVMF).

set timeout=0
set default=0
set debug=loader,multiboot2,mmap

# route GRUB console (incl. debug) to the serial port for headless debugging
insmod serial
insmod terminal
terminal_output serial

menuentry "nefuOS (multiboot2, ESP+GRUB)" {
    insmod part_gpt
    insmod fat
    insmod multiboot2
    insmod all_video
    insmod video
    insmod efi_gop
    set root=(hd0,gpt1)
    multiboot2 /EFI/nefuos/nefuos.bin
    sleep 30
    boot
}
